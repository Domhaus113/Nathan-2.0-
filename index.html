  render();
}
function deleteSavedConcept(id){
  // id here is the concept group key when sourced from pins; unpin it
  pinnedConceptKeys=pinnedConceptKeys.filter(k=>k!==id);

}

function getPinnedAsLibrary(){
  const groups=groupConcepts();
  return pinnedConceptKeys.map(key=>{
    const g=groups.find(gr=>gr.key===key);

    const avatarObj=AVATARS.find(a=>a.id===g.avatar);

function fmtR(n){if(n===null||n===undefined||isNaN(n))return '—';return 'R'+Math.round(n).toLocaleString();}
function fmtX(n,d){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toFixed(d===undefined?2:d);}
function fmtP(n,d){if(n===null||n===undefined||isNaN(n))return '—';return Number(n).toFixed(d===undefined?1:d)+'%';}
function fmtN(n){if(n===null||n===undefined||isNaN(n))return '—';return Math.round(n).toLocaleString();}
function toast(msg){const el=document.createElement('div');el.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;background:#202020;border:.5px solid #FDB715;border-radius:8px;padding:9px 16px;font-size:13px;color:#FDB715;font-family:DM Sans,sans-serif;';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}

function conceptKey(c){return [c.prod,c.avatar,c.aw,c.angle,c.problem||''].join('||');}
function groupConcepts(){
  const groups={};
  creatives.forEach(c=>{const k=conceptKey(c);if(!groups[k])groups[k]={key:k,prod:c.prod,avatar:c.avatar,aw:c.aw,angle:c.angle,problem:c.problem||'',items:[]};groups[k].items.push(c);});
  return Object.values(groups).map(g=>{
    const wm=g.items.filter(i=>i.metrics);
    const avgCpa=wm.length?wm.reduce((s,i)=>s+(i.metrics.cpa||0),0)/wm.length:null;
    const avgRoas=wm.length?wm.reduce((s,i)=>s+(i.metrics.roas||0),0)/wm.length:null;
    return {...g,avgCpa,avgRoas,count:g.items.length,withData:wm.length};
  }).sort((a,b)=>{if(a.avgRoas===null&&b.avgRoas===null)return 0;if(a.avgRoas===null)return 1;if(b.avgRoas===null)return -1;return b.avgRoas-a.avgRoas;});
}
function normMatch(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}

function getHomeRangeBounds(){
  const today=new Date().toISOString().slice(0,10);
  const key=state.homeRangeKey;
  if(key==='custom'&&state.homeCustomStart&&state.homeCustomEnd){
    return {start:state.homeCustomStart<=state.homeCustomEnd?state.homeCustomStart:state.homeCustomEnd,end:state.homeCustomStart<=state.homeCustomEnd?state.homeCustomEnd:state.homeCustomStart};
  }
  if(key==='all'&&state.metaDailyData.length){
    const dates=state.metaDailyData.map(d=>d.date).sort();
    return {start:dates[0],end:dates[dates.length-1]};
  }
  const days=key==='7'?6:key==='14'?13:key==='30'?29:6;
  return {start:isoAdd(today,-days),end:today};
}

function smartDetectScript(text,nameGuess){
  const lower=text.toLowerCase();
  const detected=[];
  const f=state.importFields;

  // Try to extract naming code if present (e.g. O3-UGC-Mechanism-PA-DPP-001-06/26)
  const codeMatch=text.match(/([A-Z]{2,3})-([A-Za-z]+)-([A-Za-z]+)-([A-Z]{2,3})-([A-Z]{2,})-\d{3}-\d{2}\/\d{2}/);
  if(codeMatch){
    f.name=codeMatch[0];
    const [,prodCode,fmtCode,angleCode,awCode,avatarCode]=codeMatch;
    if(['O3','JP','DP','MX'].includes(prodCode)){f.prod=prodCode;detected.push('product ('+prodCode+')');}
    if(['UA','PA','SA','PrA','MA'].includes(awCode)){f.aw=awCode;detected.push('awareness ('+awCode+')');}
    if(avatarCode){f.avatar=avatarCode;detected.push('avatar ('+avatarCode+')');}
    // Format from code
    const fmtMap={Amir:'Amir',UGC:'UGC',Static:'Static',VO:'VO',Carousel:'Carousel',VSL:'VSL'};
    if(fmtMap[fmtCode]){f.fmt=fmtMap[fmtCode];detected.push('format ('+fmtCode+')');}
    // Angle from code
    const angMap={Mechanism:'Mechanism',Authority:'Authority',BandA:'BandA',Prevention:'Prevention',Social:'Social',Contrarian:'Contrarian',Testimony:'Testimony',Objection:'Objection',ProbAgit:'ProbAgit'};
    if(angMap[angleCode]){f.angle=angMap[angleCode];detected.push('angle ('+angleCode+')');}
  }

  // Fallback: keyword detection from body
  if(!f.prod){
    const prodMap=[['omega-3','O3'],['omega 3','O3'],['fish oil','O3'],['inflammation','O3'],['scratching','O3'],['itching','O3'],['dental','DP'],['teeth','DP'],['dental powder','DP'],['bad breath','DP'],['joint','JP'],['arthritis','JP'],['mobility','JP'],['bundle','MX']];
    const fp=prodMap.find(([k])=>lower.includes(k));
    if(fp){f.prod=fp[1];detected.push('product (from keywords)');}
  }
  if(!f.fmt){
    if(lower.includes('dr. amir')||lower.includes('dr amir')){f.fmt='Amir';detected.push('format (Amir)');}
    else if(lower.includes('ugc')||lower.includes('creator')||lower.includes('real owner')){f.fmt='UGC';detected.push('format (UGC)');}
    else if(lower.includes('voiceover')||lower.includes('voice over')||lower.includes('v/o')){f.fmt='VO';detected.push('format (VO)');}
  }
  if(!f.aw){
    if(lower.includes('unaware')){f.aw='UA';detected.push('awareness (UA)');}
    else if(lower.includes('problem aware')){f.aw='PA';detected.push('awareness (PA)');}
    else if(lower.includes('solution aware')){f.aw='SA';detected.push('awareness (SA)');}
    else if(lower.includes('product aware')){f.aw='PrA';detected.push('awareness (PrA)');}
  }
  if(!f.angle){
    const angKeywords=[['mechanism','Mechanism'],['root cause','Mechanism'],['contrarian','Contrarian'],['authority','Authority'],['social proof','Social'],['testimonial','Testimony'],['testimony','Testimony'],['prevention','Prevention'],['transformation','BandA'],['before and after','BandA'],['objection','Objection']];
    const fa=angKeywords.find(([k])=>lower.includes(k));
    if(fa){f.angle=fa[1];detected.push('angle (from keywords)');}
  }
  // Avatar detection
  if(!f.avatar){
    const avKeywords=[['tarryn','DAP'],['desperate allergy','DAP'],['dap','DAP'],['kyle','PWP'],['proactive wellness','PWP'],['pwp','PWP'],['sceptical deon','SD'],['deon','SD'],['rené','RRF'],['rene','RRF'],['raw feeder','RRF'],['rrf','RRF'],['terrified tanya','TT'],['tanya','TT'],['premium pete','PPP'],['pete','PPP'],['ppp','PPP'],['guilty grace','GG'],['grace','GG'],['heartbroken helen','HH'],['helen','HH'],['diagnosed-dread dineo','DDD'],['dineo','DDD'],['nsaid-nervous nadia','NNN'],['nadia','NNN']];
    const av=avKeywords.find(([k])=>lower.includes(k));
    if(av){f.avatar=av[1];detected.push('avatar (from keywords)');}
  }

  // Auto-generate name if not found from code
  if(!f.name){
    const mm=String(new Date().getMonth()+1).padStart(2,'0');
    const yy=String(new Date().getFullYear()).slice(2);
    f.name=[f.prod||'XX',f.fmt||'XX',f.angle||'XX',f.aw||'XX',f.avatar||'NEW','001',mm+'/'+yy].join('-');
    if(detected.length)detected.push('name (auto-generated)');
  }

  state.importFields=f;
  return detected;
}

function autoDetectScript(){
  const text=state.pasteScript;
  if(!text.trim()){state.detectMsg='Paste a script first.';renderAddForm();return;}
  state.newC.script=text;
  const lower=text.toLowerCase();const detected=[];
  const prodMap=[['omega-3','O3'],['dental','DP'],['joint','JP'],['bundle','MX']];

function getAllPeriodRecords(){
  const out=[];
  creatives.forEach(c=>{(c.history||[]).forEach(h=>{
    if(!h.periodStart||!h.periodEnd)return;
    out.push({creative:c,m:h});
  });});
  return out;
}
function getEarliestLatestDates(){
  const recs=getAllPeriodRecords();
  if(!recs.length)return null;
  let min=recs[0].m.periodStart,max=recs[0].m.periodEnd;
  recs.forEach(r=>{if(r.m.periodStart<min)min=r.m.periodStart;if(r.m.periodEnd>max)max=r.m.periodEnd;});
  return {min,max};
}
function rangesOverlap(aStart,aEnd,bStart,bEnd){return aStart<=bEnd&&bStart<=aEnd;}
function aggregateRange(rangeStart,rangeEnd){
  if(!rangeStart||!rangeEnd)return null;
  const lo=rangeStart<=rangeEnd?rangeStart:rangeEnd;
  const hi=rangeStart<=rangeEnd?rangeEnd:rangeStart;
  const byCreative={};
  getAllPeriodRecords().forEach(r=>{
    if(!rangesOverlap(r.m.periodStart,r.m.periodEnd,lo,hi))return;
    if(!byCreative[r.creative.name])byCreative[r.creative.name]={creative:r.creative,periods:[]};
    byCreative[r.creative.name].periods.push(r.m);
  });
  const rows=Object.values(byCreative).map(entry=>{
    const ps=entry.periods;
    const sum=key=>ps.reduce((s,p)=>s+(p[key]||0),0);
    const totalSpend=sum('spend');
    const totalPV=sum('purchasesValue');
    const avgW=key=>{if(!totalSpend)return ps.reduce((s,p)=>s+(p[key]||0),0)/ps.length;return ps.reduce((s,p)=>s+(p[key]||0)*(p.spend||0),0)/totalSpend;};
    return {creative:entry.creative,m:{
      spend:totalSpend,reach:sum('reach'),impressions:sum('impressions'),linkClicks:sum('linkClicks'),
      purchases:sum('purchases'),purchasesValue:totalPV,addsToCart:sum('addsToCart'),checkoutsInitiated:sum('checkoutsInitiated'),
      cpa:avgW('cpa'),ctr:avgW('ctr'),roas:totalSpend?totalPV/totalSpend:null,cpc:avgW('cpc'),cpm:avgW('cpm'),periodsUsed:ps.length,
    }};
  });
  if(!rows.length)return null;
  const sum=key=>rows.reduce((s,r)=>s+(r.m[key]||0),0);
  const avgW=key=>{const tot=sum('spend');if(!tot)return rows.reduce((s,r)=>s+(r.m[key]||0),0)/rows.length;return rows.reduce((s,r)=>s+(r.m[key]||0)*(r.m.spend||0),0)/tot;};
  const totalSpend=sum('spend');
  const totalPurchasesValue=sum('purchasesValue');
  return {
    rows,
    spend:totalSpend,reach:sum('reach'),impressions:sum('impressions'),linkClicks:sum('linkClicks'),
    purchases:sum('purchases'),purchasesValue:totalPurchasesValue,addsToCart:sum('addsToCart'),checkoutsInitiated:sum('checkoutsInitiated'),
    avgCpa:avgW('cpa'),avgCtr:avgW('ctr'),avgRoas:totalSpend?totalPurchasesValue/totalSpend:null,avgCpc:avgW('cpc'),avgCpm:avgW('cpm'),
  };
}
function fmtDateShort(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short'});}
function fmtDateFull(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}
function isoAdd(iso,days){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}
function daysInMonth(year,month){return new Date(year,month+1,0).getDate();}

function getAccountBenchmarks(){
  const withData=creatives.filter(c=>c.metrics);
  if(!withData.length)return null;
  const totalSpend=withData.reduce((s,c)=>s+(c.metrics.spend||0),0);
  const avgRoas=withData.reduce((s,c)=>s+(c.metrics.roas||0),0)/withData.length;
  const avgCpa=withData.reduce((s,c)=>s+(c.metrics.cpa||0),0)/withData.length;
  return {totalSpend,avgRoas,avgCpa,count:withData.length};
}

function analyzeCreative(c){
  const m=c.metrics;
  if(!m)return {noData:true};
  const bench=getAccountBenchmarks();
  const spendShare=bench&&bench.totalSpend?(m.spend/bench.totalSpend)*100:0;
  const roasVsAvg=bench&&bench.avgRoas?m.roas/bench.avgRoas:1;
  const reasons=[];
  let verdict='Stable',verdictColor='#06B4FC';

  // Breakeven check first — this is an absolute profitability line, independent of how other creatives are doing
  const belowBreakevenRoas=m.roas<BREAKEVEN.breakevenRoas;
  const aboveBreakevenCpa=m.cpa>BREAKEVEN.breakevenCpa;
  const losingMoney=belowBreakevenRoas||aboveBreakevenCpa;

  // Target zone: R150–R170 CPA is the realistic target range
  const atTarget=m.cpa>=BREAKEVEN.targetCpaLow&&m.cpa<=BREAKEVEN.targetCpaHigh;
  // Scaling: below the target floor (better than target)
  const belowTarget=m.cpa<BREAKEVEN.targetCpaLow;
  // Alive but not scaling: between target ceiling and breakeven
  const aliveNotScaling=m.cpa>BREAKEVEN.targetCpaHigh&&m.cpa<=BREAKEVEN.breakevenCpa;

  // Fatigue signal: rising frequency + softening ROAS is the classic SOP 05 pattern
  const freqHigh=m.frequency&&m.frequency>2.0;
  const roasWeak=roasVsAvg<0.7;
  const roasStrong=roasVsAvg>=1.3;
  const cpaHigh=bench&&bench.avgCpa&&m.cpa>bench.avgCpa*1.3;
  const overConcentrated=spendShare>=40;

  if(losingMoney&&(c.status==='Fatigued'||freqHigh)){
    verdict='Fatigued';verdictColor='#f87171';
    if(c.status==='Fatigued')reasons.push('Marked Fatigued in the tracker.');
    if(freqHigh)reasons.push('Frequency is at '+fmtX(m.frequency,2)+' \u2014 above the 2.0 ceiling SOP 05 flags as the point an audience starts seeing the same ad too often.');
    reasons.push('ROAS ('+fmtX(m.roas)+'x) is below the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven line (R'+BREAKEVEN.aov+' AOV, R'+Math.round(BREAKEVEN.breakevenCpa)+' breakeven cost per result) \u2014 this is currently losing money, not just underperforming the account average.');
  } else if(losingMoney){
    verdict='Losing money';verdictColor='#f87171';
    if(belowBreakevenRoas)reasons.push('ROAS ('+fmtX(m.roas)+'x) is below the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven line on a R'+BREAKEVEN.aov+' AOV \u2014 every sale this ad generates is currently costing more in ad spend than the order is worth.');
    if(aboveBreakevenCpa)reasons.push('Cost per result ('+fmtR(m.cpa)+') is above the R'+Math.round(BREAKEVEN.breakevenCpa)+' breakeven CPA \u2014 this is the hard profitability line, not a relative comparison.');
  } else if(overConcentrated){
    verdict='Concentration risk';verdictColor='#D4770A';
    reasons.push('This single creative is carrying '+fmtX(spendShare,1)+'% of total account spend \u2014 above the 40\u201350% ceiling SOP 01/05 sets for any one ad. This is a fragility issue even though the numbers below may look strong: if it fatigues, the account has no backup absorbing that volume.');
    if(roasStrong)reasons.push('ROAS ('+fmtX(m.roas)+'x) is genuinely healthy at '+fmtX(roasVsAvg)+'x the account average and clear of the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven line \u2014 the concern here is concentration, not profitability.');
  } else if(belowTarget){
    // CPA below R150 — better than target, scale
    verdict='Scaling';verdictColor='#4ade80';
    reasons.push('CPA ('+fmtR(m.cpa)+') is below the R'+BREAKEVEN.targetCpaLow+' target floor \u2014 this is outperforming the target range (R'+BREAKEVEN.targetCpaLow+'\u2013R'+BREAKEVEN.targetCpaHigh+') and is comfortably clear of the R'+Math.round(BREAKEVEN.breakevenCpa)+' breakeven line.');
    reasons.push('ROAS ('+fmtX(m.roas)+'x) is running '+fmtX(roasVsAvg)+'x the account average ('+fmtX(bench.avgRoas)+'x).');
    if(spendShare<25)reasons.push('Currently only '+fmtX(spendShare,1)+'% of total account spend \u2014 there is real room to push more budget behind this before it approaches the 40\u201350% single-ad ceiling.');
  } else if(atTarget){
    // CPA R150–R170 — at target
    verdict='At target';verdictColor='#4ade80';
    reasons.push('CPA ('+fmtR(m.cpa)+') is sitting inside the R'+BREAKEVEN.targetCpaLow+'\u2013R'+BREAKEVEN.targetCpaHigh+' target range \u2014 this is performing exactly where it needs to be. Hold spend steady and monitor for fatigue signals.');
    reasons.push('ROAS ('+fmtX(m.roas)+'x) is clear of the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven line with '+fmtX(BREAKEVEN.margin*100,1)+'% margin at play.');
  } else if(aliveNotScaling){
    // CPA R171–R292 — alive but not hitting target
    verdict='Alive — not at target';verdictColor='#D4770A';
    reasons.push('CPA ('+fmtR(m.cpa)+') is profitable \u2014 above the R'+Math.round(BREAKEVEN.breakevenCpa)+' breakeven line \u2014 but hasn\u2019t reached the R'+BREAKEVEN.targetCpaLow+'\u2013R'+BREAKEVEN.targetCpaHigh+' target range yet. The account is making money here, just not at the margin that justifies scaling.');
    if(cpaHigh)reasons.push('CPA is also running '+fmtX((m.cpa/bench.avgCpa-1)*100,0)+'% above the account average ('+fmtR(bench.avgCpa)+') \u2014 other creatives are buying more efficiently right now.');
    if(roasWeak)reasons.push('ROAS ('+fmtX(m.roas)+'x) is below the account average ('+fmtX(bench.avgRoas)+'x), which suggests the hook or angle isn\u2019t converting as efficiently as the portfolio mean.');
  } else if(cpaHigh||roasWeak){
    verdict='Needs attention';verdictColor='#D4770A';
    if(cpaHigh)reasons.push('Cost per result ('+fmtR(m.cpa)+') is running '+fmtX((m.cpa/bench.avgCpa-1)*100,0)+'% above the account average ('+fmtR(bench.avgCpa)+'), though still under the R'+Math.round(BREAKEVEN.breakevenCpa)+' breakeven line.');
    if(roasWeak)reasons.push('ROAS ('+fmtX(m.roas)+'x) is below the account average ('+fmtX(bench.avgRoas)+'x), though still above the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven point.');
  } else {
    reasons.push('ROAS ('+fmtX(m.roas)+'x) and cost per result ('+fmtR(m.cpa)+') are both tracking close to the account average and clear of the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven line \u2014 no strong signal either way yet.');
  }

  const actions=[];
  if(verdict==='Fatigued'){
    actions.push('Hook swap: this body may still have life \u2014 record 5\u201310 new hook variations on the same script before retiring it (SOP 05.3).');
    actions.push('If a hook swap doesn\u2019t recover it, convert to a different format (static \u2192 advertorial, or video \u2192 UGC) rather than scrapping the concept outright.');
  } else if(verdict==='Losing money'){
    actions.push('This is below breakeven (R'+Math.round(BREAKEVEN.breakevenCpa)+' CPA / '+fmtX(BREAKEVEN.breakevenRoas,2)+'x ROAS), not just below target \u2014 don\u2019t wait for the next data pull. Either fix the hook/angle or pause spend on it.');
    actions.push('Per SOP 02.5, check the angle first \u2014 a losing ad usually has a wrong argument for this avatar\u2019s awareness level, not just weak execution.');
  } else if(verdict==='Concentration risk'){
    actions.push('Build and test a backup creative for this exact concept now, while this one is still performing \u2014 don\u2019t wait for it to fatigue first.');
    actions.push('Consider capping or gently tapering spend on this single ad while the backup ramps, rather than letting it keep absorbing an outsized share by default under CBO.');
  } else if(verdict==='Scaling'){
    actions.push('CPA is below R'+BREAKEVEN.targetCpaLow+' \u2014 this is outperforming target. Increase budget in controlled steps and make sure a tested backup creative for this same concept exists before pushing further.');
    if(c.fmt!=='UGC')actions.push('Consider a UGC or partnership-ad variant of this concept \u2014 partnership ads consistently outperform brand-owned creative on cold audiences and remain underused (SOP 04.5).');
  } else if(verdict==='At target'){
    actions.push('CPA is in the R'+BREAKEVEN.targetCpaLow+'\u2013R'+BREAKEVEN.targetCpaHigh+' target zone \u2014 hold spend steady. Don\u2019t over-optimise a creative that\u2019s performing where it needs to be.');
    actions.push('Watch frequency and monitor the next 2 data pulls for fatigue signals before making any budget moves.');
  } else if(verdict==='Alive \u2014 not at target'){
    actions.push('Profitable but not at target (R'+BREAKEVEN.targetCpaLow+'\u2013R'+BREAKEVEN.targetCpaHigh+' CPA). Per SOP 02.5, fix the angle before touching anything else \u2014 check whether the core argument matches this avatar\u2019s actual awareness level.');
    actions.push('If the angle is sound, the hook is the most likely single point of failure \u2014 grade it against the 5-criteria system and rewrite if it scores below 20/25.');
  } else if(verdict==='Needs attention'){
    actions.push('Per SOP 02.5, fix the angle before touching anything else \u2014 check whether the core argument matches this avatar\u2019s actual awareness level before blaming the hook or visuals.');
    actions.push('If the body and offer are sound, the hook is the most likely single point of failure \u2014 grade it against the 5-criteria system and rewrite if it scores below 20/25.');
  } else {
    actions.push('Let this run \u2014 there isn\u2019t a strong enough signal yet to scale or intervene. Revisit after more spend/data accumulates.');
  }

  return {verdict,verdictColor,reasons,actions,spendShare,roasVsAvg};
}

function generateAccountAnalysis(){
  const withData=creatives.filter(c=>c.metrics);
  if(!withData.length)return null;
  const bench=getAccountBenchmarks();
  const analyzed=withData.map(c=>({c,a:analyzeCreative(c)}));

  // 1. What's doing well
  const scaling=analyzed.filter(x=>x.a.verdict==='Scaling'||x.a.verdict==='At target').sort((x,y)=>y.a.roasVsAvg-x.a.roasVsAvg);
  const doingWell=scaling.map(x=>x.c.name+' \u2014 '+x.a.verdict+' | '+fmtX(x.c.metrics.roas)+'x ROAS, CPA '+fmtR(x.c.metrics.cpa)+(x.a.verdict==='Scaling'?' (below R'+BREAKEVEN.targetCpaLow+' target floor)':' (in R'+BREAKEVEN.targetCpaLow+'\u2013R'+BREAKEVEN.targetCpaHigh+' target range)')+', '+fmtX(x.a.spendShare,1)+'% of spend.');
  if(!doingWell.length)doingWell.push('Nothing has reached the R'+BREAKEVEN.targetCpaHigh+' target ceiling or below yet \u2014 the account doesn\u2019t yet have a creative performing inside or above the target range.');

  // 2. What's not doing well
  const struggling=analyzed.filter(x=>x.a.verdict==='Fatigued'||x.a.verdict==='Needs attention'||x.a.verdict==='Losing money'||x.a.verdict==='Alive \u2014 not at target').sort((x,y)=>x.a.roasVsAvg-y.a.roasVsAvg);
  const losingMoney=analyzed.filter(x=>x.a.verdict==='Losing money');
  const notDoingWell=struggling.map(x=>x.c.name+' \u2014 '+x.a.verdict.toLowerCase()+': '+x.a.reasons[0]);
  if(losingMoney.length)notDoingWell.unshift(losingMoney.length+' creative'+(losingMoney.length===1?' is':'s are')+' below the '+fmtX(BREAKEVEN.breakevenRoas,2)+'x breakeven line (R'+BREAKEVEN.aov+' AOV) right now \u2014 this is an actual loss, not just an underperformance signal.');
  if(!notDoingWell.length)notDoingWell.push('No creative is currently flagged Fatigued, Losing Money, Alive-not-at-target, or Needs Attention \u2014 the portfolio is healthy on the data available.');

  // 3. Concepts to push (group-level, using existing groupConcepts logic)
  const groups=groupConcepts().filter(g=>g.avgRoas!==null);
  const pushable=groups.filter(g=>g.avgRoas>=bench.avgRoas*1.2).sort((a,b)=>b.avgRoas-a.avgRoas).slice(0,4);
  const conceptsToPush=pushable.map(g=>{
    const avatarObj=AVATARS.find(a=>a.id===g.avatar);
    const name=(avatarObj?avatarObj.name:g.avatar);
    return g.prod+' \u00d7 '+name+' \u00d7 '+(ANG[g.angle]||g.angle)+' \u2014 '+fmtX(g.avgRoas)+'x avg ROAS across '+g.count+' script'+(g.count===1?'':'s')+'. Per SOP 02.5, angle and offer are proven here \u2014 the next lever is persona breadth or a partnership-ad variant, not a new angle.';
  });
  if(!conceptsToPush.length)conceptsToPush.push('No concept group is clearing 1.2x the account average ROAS yet with enough scripts behind it to call a real winner.');

  // 4. Content to change
  const toChange=struggling.filter(x=>x.a.verdict==='Fatigued').map(x=>x.c.name+' \u2014 '+(x.a.actions[0]||'Needs a refresh.'));
  const formatCounts={};creatives.forEach(c=>{formatCounts[c.fmt]=(formatCounts[c.fmt]||0)+1;});
  const ugcShare=creatives.length?((formatCounts['UGC']||0)/creatives.length)*100:0;
  if(ugcShare<20&&creatives.length>=4)toChange.push('Only '+fmtX(ugcShare,0)+'% of tracked creative is UGC \u2014 SOP 20.5 notes real pet-owner UGC is already on-brand for Vets2Pets and remains underused relative to how well it tends to perform on cold audiences.');
  if(!toChange.length)toChange.push('Nothing urgent to swap out right now \u2014 revisit once more creatives accumulate spend history.');

  // 5/6. Hooks performing well / underperforming \u2014 inferred from format + verdict since no dedicated hook-grade data is tracked per creative yet
  const hooksWell=scaling.slice(0,3).map(x=>x.c.angle+' angle ('+x.c.fmt+' format, '+x.c.avatar+') \u2014 the '+x.c.name+' hook is the standout; consider 5\u20136 fresh hook variations on this same proven body per SOP 03.5 to extend its life before it fatigues.');
  if(!hooksWell.length)hooksWell.push('No hook has separated itself from the pack yet on the data available.');
  const hooksWeak=struggling.filter(x=>x.a.verdict==='Needs attention').slice(0,3).map(x=>x.c.angle+' angle ('+x.c.fmt+', '+x.c.avatar+') \u2014 per SOP 03.5, when the body is sound the hook is usually the single broken part; grade it against the 5-criteria system before rewriting the rest.');
  if(!hooksWeak.length)hooksWeak.push('No hook is clearly underperforming right now based on available data.');

  return {doingWell,notDoingWell,conceptsToPush,toChange,hooksWell,hooksWeak,bench};
}

}

function renderCalendar(){
  const bounds=getEarliestLatestDates();
  if(!state.calViewMonth){
    const seedDate=bounds?bounds.max:new Date().toISOString().slice(0,10);
    state.calViewMonth=seedDate.slice(0,7);
  }
  const [yy,mm]=state.calViewMonth.split('-').map(Number);
  const monthIdx=mm-1;
  const firstOfMonth=new Date(yy,monthIdx,1);
  const startWeekday=firstOfMonth.getDay();
  const totalDays=daysInMonth(yy,monthIdx);
  const monthName=firstOfMonth.toLocaleDateString('en-ZA',{month:'long',year:'numeric'});
  const lo=state.calRangeStart&&state.calRangeEnd?(state.calRangeStart<=state.calRangeEnd?state.calRangeStart:state.calRangeEnd):state.calRangeStart;
  const hi=state.calRangeStart&&state.calRangeEnd?(state.calRangeStart<=state.calRangeEnd?state.calRangeEnd:state.calRangeStart):state.calRangeStart;
  let cells='';
  for(let i=0;i<startWeekday;i++)cells+='<div></div>';
  for(let d=1;d<=totalDays;d++){
    const iso=yy+'-'+String(mm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isStart=iso===state.calRangeStart;
    const isEnd=iso===state.calRangeEnd;
    const inRange=lo&&hi&&iso>=lo&&iso<=hi;
    const isToday=iso===new Date().toISOString().slice(0,10);
    cells+=`<div class="caldate${inRange?' in-range':''}${isStart||isEnd?' endpoint':''}" data-caldate="${iso}"><span style="${isToday&&!inRange?'text-decoration:underline;':''}">${d}</span></div>`;
  }
  return `<div style="background:var(--r);border:.5px solid var(--bd);border-radius:10px;padding:16px 18px;max-width:340px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <button class="btn bg" id="calPrevMonthBtn" style="padding:6px 9px;"><i class="ti ti-chevron-left"></i></button>
      <span style="font-size:13px;font-weight:500;">${monthName}</span>
      <button class="btn bg" id="calNextMonthBtn" style="padding:6px 9px;"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px;">
      ${['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:10px;color:var(--m);padding:4px 0;">${d}</div>`).join('')}
    </div>
    <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">${cells}</div>
    <div style="font-size:11px;color:var(--m);margin-top:12px;line-height:1.5;">${!state.calRangeStart?'Click a day to start a range.':!state.calRangeEnd?'Click another day to finish the range \u2014 or click the same day again for a single day.':'Click any day to start a new selection.'}</div>
  </div>`;
}

function importMetaDailyData(){
  let parsed;
  try{
    parsed=JSON.parse(state.pipeboardPaste);
  }catch(err){
    toast('Could not parse that as JSON \u2014 check it was copied in full.');
    return;
  }
  // Expects the get_insights/bulk_get_insights response shape with time_breakdown='day'
  let segs=null;
  if(parsed.segmented_metrics)segs=parsed.segmented_metrics;
  else if(parsed.results&&parsed.results[0]&&parsed.results[0].segmented_metrics)segs=parsed.results[0].segmented_metrics;
  if(!segs||!segs.length){toast('No daily segmented data found \u2014 make sure time_breakdown was set to day.');return;}

  const days=segs.map(s=>{
    const m=s.metrics;
    const actions={};(m.actions||[]).forEach(a=>{actions[a.action_type]=parseFloat(a.value)||0;});
    const actionValues={};(m.action_values||[]).forEach(a=>{actionValues[a.action_type]=parseFloat(a.value)||0;});
    // Use the canonical 'purchase' action_type only \u2014 omni_purchase/onsite_web_purchase/offsite_conversion.fb_pixel_purchase etc.
    // are the same conversion counted through different attribution paths and would double-count if summed together.
    return {
      date:m.date_start||s.period_start||s.period,
      spend:parseFloat(m.spend)||0,
      impressions:parseInt(m.impressions)||0,
      clicks:parseInt(m.clicks)||0,
      reach:parseInt(m.reach)||0,
      purchases:actions['purchase']||0,
      purchasesValue:actionValues['purchase']||0,
    };
  });
  state.metaDailyData=days;
  toast('Imported '+days.length+' day'+(days.length===1?'':'s')+' of daily Meta data \u2014 Home page date range is now live.');
  render();
}

function importMetaHierarchy(){
  let parsed;
  try{
    parsed=JSON.parse(state.pipeboardPaste);
  }catch(err){
    toast('Could not parse that as JSON \u2014 check it was copied in full.');
    return;
  }
  let ads=[];
  if(Array.isArray(parsed))ads=parsed;
  else if(parsed.results&&Array.isArray(parsed.results)){
    parsed.results.forEach(r=>{if(Array.isArray(r.insights))ads=ads.concat(r.insights);});
  } else if(parsed.insights&&Array.isArray(parsed.insights)){
    ads=parsed.insights;
  }
  if(!ads.length){toast('No ad-level rows found in that data.');return;}

  const periodStart=ads[0].date_start||new Date().toISOString().slice(0,10);
  const periodEnd=ads[0].date_stop||periodStart;

  const adsetMap={};
  ads.forEach(ad=>{
    const adsetId=ad.adset_id||'unknown';
    if(!adsetMap[adsetId]){
      adsetMap[adsetId]={adsetId,adsetName:ad.adset_name||'(unnamed ad set)',campaignName:ad.campaign_name||'',ads:[]};
    }
    const spend=ad.spend||0,impressions=ad.impressions||0,clicks=ad.clicks||0;
    const purchases=ad.purchase_conversions||ad.conversions||0;
    const purchasesValue=ad.purchase_conversion_value||ad.conversion_value||0;
    // Best-effort tracker link, purely informational \u2014 does not gate whether this ad/adset displays
    const na=normMatch(ad.ad_name||'');
    let linkedScript=null,bestLen=0;
    creatives.forEach(c=>{const nn=normMatch(c.name);if(nn.length>3&&na.includes(nn)&&nn.length>bestLen){linkedScript=c.name;bestLen=nn.length;}});
    adsetMap[adsetId].ads.push({
      adId:ad.ad_id,adName:ad.ad_name||'(unnamed ad)',spend,impressions,clicks,purchases,purchasesValue,
      roas:spend?purchasesValue/spend:0,cpa:purchases?spend/purchases:0,ctr:impressions?(clicks/impressions)*100:0,
      linkedScript,
    });
  });

  state.metaAdsets=Object.values(adsetMap).map(a=>{
    const sum=key=>a.ads.reduce((s,ad)=>s+(ad[key]||0),0);
    const spend=sum('spend'),purchasesValue=sum('purchasesValue'),purchases=sum('purchases'),impressions=sum('impressions'),clicks=sum('clicks');

function importPipeboardData(){
  let parsed;
  try{
    parsed=JSON.parse(state.pipeboardPaste);
  }catch(err){
    toast('Could not parse that as JSON \u2014 check it was copied in full.');
    return;
  }
  // Accept either the raw bulk_get_insights ad-level response shape, or a plain array of ad objects
  let ads=[];
  if(Array.isArray(parsed))ads=parsed;
  else if(parsed.results&&Array.isArray(parsed.results)){
    parsed.results.forEach(r=>{if(Array.isArray(r.insights))ads=ads.concat(r.insights);});
  } else if(parsed.insights&&Array.isArray(parsed.insights)){
    ads=parsed.insights;
  }
  if(!ads.length){toast('No ad-level rows found in that data.');return;}

  const periodStart=ads[0].date_start||new Date().toISOString().slice(0,10);
  const periodEnd=ads[0].date_stop||periodStart;
  const periodLabel=periodStart+' to '+periodEnd;

  // Group ALL ads first by best-match creative index, so duplicates/variants get combined rather than overwriting each other
  const matchedAdsByIdx={};
  const newUnmatched=[];
  ads.forEach(ad=>{
    const adName=ad.ad_name||'';
    const na=normMatch(adName);
    let bestIdx=-1,bestLen=0;
    creatives.forEach((c,i)=>{const nn=normMatch(c.name);if(nn.length>3&&na.includes(nn)&&nn.length>bestLen){bestIdx=i;bestLen=nn.length;}});
    if(bestIdx===-1){
      const spend=ad.spend||0,impressions=ad.impressions||0,clicks=ad.clicks||0;
      const purchases=ad.purchase_conversions||ad.conversions||0;
      const purchasesValue=ad.purchase_conversion_value||ad.conversion_value||0;
      const metrics={spend,reach:ad.reach||0,impressions,frequency:ad.frequency||0,linkClicks:clicks,cpm:impressions?(spend/impressions)*1000:0,cpc:clicks?spend/clicks:0,cpa:purchases?spend/purchases:0,ctr:impressions?(clicks/impressions)*100:0,roas:ad.roas!==undefined?ad.roas:(spend?purchasesValue/spend:0),purchases,purchasesValue,variantCount:1,lastSync:periodLabel,periodStart,periodEnd,periodLabel,source:'Pipeboard',metaAdId:ad.ad_id,metaAdName:adName};
      newUnmatched.push({metaAdId:ad.ad_id,metaAdName:adName,campaignName:ad.campaign_name||'',adsetName:ad.adset_name||'',metrics});
    } else {
      if(!matchedAdsByIdx[bestIdx])matchedAdsByIdx[bestIdx]=[];
      matchedAdsByIdx[bestIdx].push(ad);
    }
  });

  let matchedCount=0,matchedAdCount=0;
  Object.keys(matchedAdsByIdx).forEach(idxStr=>{
    const idx=parseInt(idxStr,10);
    const group=matchedAdsByIdx[idx];
    matchedCount++;matchedAdCount+=group.length;
    const n=group.length;
    const sum=key=>group.reduce((s,a)=>s+(a[key]||0),0);
    const spend=sum('spend');
    const impressions=sum('impressions');
    const clicks=sum('clicks');
    const purchases=group.reduce((s,a)=>s+(a.purchase_conversions||a.conversions||0),0);
    const purchasesValue=group.reduce((s,a)=>s+(a.purchase_conversion_value||a.conversion_value||0),0);
    const reach=sum('reach');
    const avgFreq=group.reduce((s,a)=>s+(a.frequency||0),0)/n;
    const metrics={spend,reach,impressions,frequency:avgFreq,videoAvgPlayTime:0,thumbStop:0,holdRate:0,linkClicks:clicks,landingPageViews:0,
      cpm:impressions?(spend/impressions)*1000:0,cpc:clicks?spend/clicks:0,cpa:purchases?spend/purchases:0,ctr:impressions?(clicks/impressions)*100:0,
      addsToCart:0,websiteAddsToCart:0,costPerAddToCart:0,checkoutsInitiated:0,websiteCheckoutsInitiated:0,costPerCheckout:0,
      avgPurchaseValue:purchases?purchasesValue/purchases:0,cvr:clicks?(purchases/clicks)*100:0,
      roas:spend?purchasesValue/spend:0,websiteRoas:spend?purchasesValue/spend:0,
      purchases,websitePurchases:purchases,purchasesValue,websitePurchasesValue:purchasesValue,
      contentViews:0,variantCount:n,lastSync:periodLabel,periodStart,periodEnd,periodLabel,source:'Pipeboard',
      metaAdNames:group.map(a=>a.ad_name).join(', ')};
    const existingHist=(creatives[idx].history||[]).filter(h=>h.periodLabel!==periodLabel);
    creatives[idx]={...creatives[idx],metrics,history:existingHist.concat([metrics])};
  });

  // Replace any previous unmatched entries from the same period, keep ones from other periods
  state.unmatchedMetaAds=state.unmatchedMetaAds.filter(u=>u.metrics.periodLabel!==periodLabel).concat(newUnmatched);
  state.csvSummary={matchedCreatives:matchedCount,matchedRows:matchedAdCount,unmatched:newUnmatched.length,periodLabel};
  state.pipeboardPaste='';state.showPipeboardImport=false;
  state.trkTab=newUnmatched.length?'review':'summary';
  render();
}

function linkUnmatchedAd(idx,creativeName){
  const u=state.unmatchedMetaAds[idx];
  if(!u)return;
  const ci=creatives.findIndex(c=>c.name===creativeName);
  if(ci===-1){toast('Creative not found.');return;}
  const existingHist=(creatives[ci].history||[]).filter(h=>h.periodLabel!==u.metrics.periodLabel);
  creatives[ci]={...creatives[ci],metrics:u.metrics,history:existingHist.concat([u.metrics])};
  state.unmatchedMetaAds=state.unmatchedMetaAds.filter((x,i)=>i!==idx);
  state.linkingAdIdx=null;
  toast('Linked to '+creativeName+'.');
  render();
}
function dismissUnmatchedAd(idx){
  state.unmatchedMetaAds=state.unmatchedMetaAds.filter((x,i)=>i!==idx);

}
function addUnmatchedAsNewCreative(idx){

  creatives=[{name:u.metaAdName,status:'Ready for production',prod:'',aw:'',angle:'',avatar:'',problem:'',fmt:'',platform:'Meta',offer:'',date:u.metrics.periodStart.slice(5,7)+'/'+u.metrics.periodStart.slice(2,4),script:'',metrics:u.metrics,history:[u.metrics]},...creatives];

}

      const metrics={spend:sum('Amount spent (ZAR)'),reach:sum('Reach'),impressions:sum('Impressions'),frequency:avg('Frequency'),videoAvgPlayTime:avg('Video average play time'),thumbStop:avg('Thumb Stop Ratio')*100,holdRate:avg('Hold Rate')*100,linkClicks:sum('Link clicks'),landingPageViews:sum('Website landing page views'),cpm:avg('CPM (cost per 1,000 impressions) (ZAR)'),cpc:avg('CPC (cost per link click) (ZAR)'),cpa:avg('Cost per results'),ctr:avg('CTR (link click-through rate)'),addsToCart:sum('Adds to cart'),websiteAddsToCart:sum('Website adds to cart'),costPerAddToCart:avg('Cost per add to cart (ZAR)'),checkoutsInitiated:sum('Checkouts initiated'),websiteCheckoutsInitiated:sum('Website checkouts initiated'),costPerCheckout:avg('Cost per checkout initiated (ZAR)'),avgPurchaseValue:avg('Average purchases conversion value'),cvr:avg('Conversion rate')*100,roas:avg('Purchase ROAS (return on ad spend)'),websiteRoas:avg('Website purchase ROAS (return on ad spend)'),purchases:sum('Purchases'),websitePurchases:sum('Website purchases'),purchasesValue:sum('Purchases conversion value'),websitePurchasesValue:sum('Website purchases conversion value'),contentViews:sum('Content views'),variantCount:n,lastSync:periodLabel,periodStart:startDate,periodEnd:endDate,periodLabel:periodLabel,source:'CSV'};
      const existingHist=(creatives[idx].history||[]).filter(h=>h.periodLabel!==periodLabel);
      const hist=existingHist.concat([metrics]);

    const newUnmatched=unmatchedRows.map(row=>{

      const purchases=num(row['Purchases']);

      return {metaAdId:null,metaAdName:row['Ad set name']||row['Ad name']||'(unnamed)',campaignName:row['Campaign name']||'',adsetName:row['Ad set name']||'',
        metrics:{spend,reach:num(row['Reach']),impressions,frequency:num(row['Frequency']),videoAvgPlayTime:num(row['Video average play time']),thumbStop:num(row['Thumb Stop Ratio'])*100,holdRate:num(row['Hold Rate'])*100,linkClicks:clicks,landingPageViews:num(row['Website landing page views']),cpm:num(row['CPM (cost per 1,000 impressions) (ZAR)']),cpc:num(row['CPC (cost per link click) (ZAR)']),cpa:num(row['Cost per results']),ctr:num(row['CTR (link click-through rate)']),addsToCart:num(row['Adds to cart']),websiteAddsToCart:num(row['Website adds to cart']),costPerAddToCart:num(row['Cost per add to cart (ZAR)']),checkoutsInitiated:num(row['Checkouts initiated']),websiteCheckoutsInitiated:num(row['Website checkouts initiated']),costPerCheckout:num(row['Cost per checkout initiated (ZAR)']),avgPurchaseValue:num(row['Average purchases conversion value']),cvr:num(row['Conversion rate'])*100,roas:num(row['Purchase ROAS (return on ad spend)']),websiteRoas:num(row['Website purchase ROAS (return on ad spend)']),purchases,websitePurchases:num(row['Website purchases']),purchasesValue,websitePurchasesValue:num(row['Website purchases conversion value']),contentViews:num(row['Content views']),variantCount:1,lastSync:periodLabel,periodStart:startDate,periodEnd:endDate,periodLabel,source:'CSV'}};

        ${f.addLabel?`<div style="margin-top:10px;">
          ${adding?`<div style="background:var(--r);border:.5px solid ${f.color};border-radius:9px;padding:14px 16px;">
            <div style="font-size:12px;font-weight:500;color:${f.color};margin-bottom:10px;text-transform:uppercase;">${f.addLabel}</div>
            <input class="tf-sm" id="brainAddName" placeholder="${f.key==='decisions'?'Decision title...':'Name...'}" style="margin-bottom:8px;" value="${state.brainAddDraft.name||''}">
            <textarea class="tf-sm" id="brainAddSummary" rows="3" placeholder="${f.key==='decisions'?'What was decided, and why...':'Summary / content...'}" style="resize:vertical;margin-bottom:10px;">${state.brainAddDraft.summary||''}</textarea>
            <div style="display:flex;gap:8px;">
              <button class="btn ba" data-brainsave="${f.key}" style="font-size:12px;padding:7px 12px;"><i class="ti ti-check"></i> Save</button>
              <button class="btn bg" data-braincancel style="font-size:12px;padding:7px 12px;">Cancel</button>
            </div>
          </div>`:`<button class="btn bg" data-brainadd="${f.key}" style="font-size:12px;width:100%;justify-content:center;padding:10px;"><i class="ti ti-plus"></i> ${f.addLabel}</button>`}
        </div>`:''}
      </div>`:''}</div>`;
  });

  ct.innerHTML=`
    ${obsidianBanner}
    ${synthPanel}
    <div class="secl" style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
      <span>Vault folders</span>
      <span style="font-size:11px;color:var(--m);font-weight:400;text-transform:none;">\u2014 maps to <code style="font-size:11px;background:#262626;padding:1px 5px;border-radius:3px;">Vets2Pets-Brain/</code> in Obsidian</span>
    </div>
    <div style="font-size:12px;color:var(--m);margin-bottom:16px;">Each folder below is a real directory in the Obsidian vault. Every entry becomes a <code style="font-size:11px;background:#262626;padding:1px 5px;border-radius:3px;">.md</code> file. The nightly synthesis job reads and writes to these folders automatically.</div>
    ${foldersHtml}
  `;

  ct.querySelectorAll('[data-braintoggle]').forEach(el=>el.onclick=()=>{
    state.brainExpandedFolders[el.dataset.braintoggle]=!state.brainExpandedFolders[el.dataset.braintoggle];
    render();
  });

  ct.querySelectorAll('[data-brainview]').forEach(el=>el.onclick=()=>{
    const [folderKey,itemId]=el.dataset.brainview.split('|');
    const folder=BRAIN_FOLDERS.find(f=>f.key===folderKey);
    const items=brainFolderItems(folderKey);
    const item=items.find(i=>String(i.id)===itemId);
    if(item)state.brainViewEntry={...item,color:folder?folder.color:'var(--a)'};
    render();
  });

  ct.querySelectorAll('[data-brainadd]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.brainAddFolder=el.dataset.brainadd;
    state.brainAddDraft={name:'',summary:''};
    render();
  });

  ct.querySelectorAll('[data-braincancel]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.brainAddFolder=null;
    state.brainAddDraft={};
    render();
  });

  ct.querySelectorAll('[data-brainsave]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const key=el.dataset.brainsave;
    const name=(document.getElementById('brainAddName')?document.getElementById('brainAddName').value:'').trim();
    const summary=(document.getElementById('brainAddSummary')?document.getElementById('brainAddSummary').value:'').trim();
    if(!name){toast('Name is required.');return;}
    const newEntry={id:Date.now().toString(36),name,summary,tags:[],date:new Date().toISOString().slice(0,10),status:'draft'};
    if(key==='decisions'){newEntry.entry=summary;}
    state.brain[key]=[...state.brain[key],newEntry];
    state.brainAddFolder=null;
    state.brainAddDraft={};
    toast('Added to '+BRAIN_FOLDERS.find(f=>f.key===key).label+'.');
    render();
  });

  if(document.getElementById('brainAddName'))document.getElementById('brainAddName').oninput=e=>{state.brainAddDraft.name=e.target.value;};
  if(document.getElementById('brainAddSummary'))document.getElementById('brainAddSummary').oninput=e=>{state.brainAddDraft.summary=e.target.value;};
}

render();
</script>
</body>
</html>
